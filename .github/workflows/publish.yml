name: Publish to npm

# Trusted publishing (OIDC): no NPM_TOKEN required.
# Configure at https://www.npmjs.com/package/@ttkit/daily-hot-api/access
#   Publisher: GitHub Actions
#   Organization or user: HelTi
#   Repository: daily-hot-api
#   Workflow filename: publish.yml
#   Allowed actions: npm publish (npm stage publish is always allowed)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @ttkit/daily-hot-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --runInBand

      - name: Publish
        run: npm publish --access public
